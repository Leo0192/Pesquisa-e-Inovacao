<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>VitAgro | Cadastro</title>

  <link rel="stylesheet" href="styles/style.css" />
  <link rel="icon" href="assets/icon/logo_vitagro.png" />
</head>

<body>
  <div class="login">

    <div class="container">
      <div class="card card-cadastro">
        <h2>Bem-vindo!</h2>
        <div class="formulario">
            <div class="campo">
                <span>Nome:</span>
                <input id="nome_input" type="text" placeholder="Seu nome" />
            </div>
            <div class="campo">
                <span>Sobrenome:</span>
                <input id="sobrenome_input" type="text" placeholder="Seu sobrenome" />
            </div>
            <div class="campo">
                <span>CPF:</span>
                <input id="cpf_input" type="text" placeholder="123.456.788-90" />
            </div>
            <div class="campo">
                <span>Tolken:</span>
                <input id="tolken_input" type="text" placeholder="Insira aqui seu código" />
            </div>
            <div class="campo">
                <span>E-mail:</span>
                <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
            </div>
            <div class="campo">
                <span>Telefone celular:</span>
                <input id="telefone_input" type="text" placeholder="(11) 91234-5678" />
            </div>
            <div class="campo">
                <span>Senha:</span>
                <input id="senha_input" type="password" placeholder="******" />
            </div>
            <div class="campo">
                <span>Confirmação da Senha:</span>
                <input id="confirmacao_senha_input" type="password" placeholder="******" />
            </div>
            <button class="botao">Cadastrar</button>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
